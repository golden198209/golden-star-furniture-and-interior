<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Golden Star Furniture & Interior - Estimator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a1a;
            color: #f4f4f4;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #2b2b2b;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        h2, h3 {
            color: #d4af37;
        }
        .section {
            margin-bottom: 20px;
            padding: 15px;
            background: #333;
            border-radius: 8px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            color: #ccc;
        }
        input, select {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            background: #222;
            border: 1px solid #444;
            color: #fff;
            border-radius: 6px;
        }
        /* Blueprint Canvas Box Styling */
        .blueprint-box {
            background: #111;
            border: 2px dashed #d4af37;
            border-radius: 8px;
            padding: 10px;
            text-align: center;
            margin-top: 15px;
        }
        canvas {
            background: #000;
            border-radius: 6px;
            width: 100%;
            max-width: 100%;
            height: auto;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Golden Star Furniture & Interior</h2>
    <p>📞 700668839 | Lalchowk, Srinagar</p>

    <!-- 1. Outer Dimensions -->
    <div class="section">
        <h3>1. Outer Dimensions</h3>
        <label>Height (ft)</label>
        <input type="number" id="height" value="6" oninput="drawBlueprint()">
        
        <label>Width (ft)</label>
        <input type="number" id="width" value="4" oninput="drawBlueprint()">
        
        <label>Depth (ft)</label>
        <input type="number" id="depth" value="1.5" oninput="drawBlueprint()">
    </div>

    <!-- 2. Doors & Shelves -->
    <div class="section">
        <h3>2. Doors, Partitions & Shelves</h3>
        <label>Number of Doors</label>
        <input type="number" id="doors" value="4" oninput="drawBlueprint()">
        
        <label>Number of Shelves</label>
        <input type="number" id="shelves" value="3" oninput="drawBlueprint()">

        <!-- Live Design Blueprint Preview Box -->
        <div class="blueprint-box">
            <h4 style="color: #d4af37; margin: 5px 0 10px 0;">Live Design Blueprint Preview</h4>
            <canvas id="wardrobeCanvas" width="400" height="350"></canvas>
        </div>
    </div>
</div>

<script>
function drawBlueprint() {
    const canvas = document.getElementById('wardrobeCanvas');
    const ctx = canvas.getContext('2d');
    
    // Clear canvas
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    // Get values
    const heightVal = parseFloat(document.getElementById('height').value) || 6;
    const widthVal = parseFloat(document.getElementById('width').value) || 4;
    const numDoors = parseInt(document.getElementById('doors').value) || 2;
    const numShelves = parseInt(document.getElementById('shelves').value) || 3;
    
    // Wardrobe Outer Box Frame
    const x = 50, y = 30, w = 300, h = 280;
    
    // Draw Outer Carcass
    ctx.strokeStyle = '#d4af37';
    ctx.lineWidth = 4;
    ctx.strokeRect(x, y, w, h);
    
    // Fill inner background
    ctx.fillStyle = '#1e1e1e';
    ctx.fillRect(x, y, w, h);
    
    // Draw Shelves (Horizontal lines inside)
    ctx.strokeStyle = '#888';
    ctx.lineWidth = 2;
    const shelfSpacing = h / (numShelves + 1);
    for (let i = 1; i <= numShelves; i++) {
        let sy = y + (shelfSpacing * i);
        ctx.beginPath();
        ctx.moveTo(x, sy);
        ctx.lineTo(x + w, sy);
        ctx.stroke();
    }
    
    // Draw Doors / Shutters (Vertical split lines)
    ctx.strokeStyle = '#d4af37';
    ctx.lineWidth = 1.5;
    const doorWidth = w / numDoors;
    for (let d = 1; d < numDoors; d++) {
        let dx = x + (doorWidth * d);
        ctx.beginPath();
        ctx.moveTo(dx, y);
        ctx.lineTo(dx, y + h);
        ctx.stroke();
    }
    
    // Draw Dimension Labels
    ctx.fillStyle = '#fff';
    ctx.font = '12px Arial';
    ctx.fillText(`Width: ${widthVal} ft`, x + w / 3, y - 10);
    ctx.fillText(`Height: ${heightVal} ft`, x - 45, y + h / 2);
}

// Initial draw on load
window.onload = drawBlueprint;
</script>

</body>
</html>
